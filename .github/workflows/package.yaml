name: build-and-publish

on:
  push:
    branches:
    - feature
    - feature/**
    - develop
    - main
    tags:
    - v*.*.*
  pull_request:
    branches:
    - feature
    - feature/**
    - develop
    - main

permissions:
  id-token: write
  contents: read
  packages: write

jobs:

  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Bootstrap patched pip and CA bundle
      shell: bash
      run: |
        python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install --upgrade "certifi>=2026.10.19"
        python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
        python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
        echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
        echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
    - name: Install tooling
      run: pip install hatch

    # -----------------------------
    # Strict SemVer + Hatch version gate
    # -----------------------------
    - name: Validate tag and hatch version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG="${GITHUB_REF#refs/tags/}"

        # Ensure tag starts with v
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "ERROR: Tag must follow strict SemVer format vX.Y.Z"
          exit 1
        fi

        TAG_VERSION="${TAG#v}"
        HATCH_VERSION=$(hatch version)

        echo "Tag version:   $TAG_VERSION"
        echo "Hatch version: $HATCH_VERSION"

        if [ "$TAG_VERSION" != "$HATCH_VERSION" ]; then
          echo "ERROR: Git tag version does not match hatch version"
          exit 1
        fi

    - name: mypy (strict type checking)
      run: hatch run dev:typecheck

    - name: ruff (format)
      run: hatch run dev:format-check

    - name: ruff (check and McCabe complexity)
      run: hatch run dev:lint-check

    - name: bandit (find common security issues)
      run: hatch run dev:security

    - name: pytest (test coverage)
      run: hatch run +py=${{ matrix.python-version }} test:test-cov

    - name: Upload coverage to Codecov
      if: github.event_name == 'push' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        files: ./coverage.xml
        disable_search: true
        fail_ci_if_error: false

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.12'
        cache: pip

    - name: Bootstrap patched pip and CA bundle
      shell: bash
      run: |
        python -m pip install --upgrade "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        python -m pip install --upgrade "certifi>=2026.10.19"
        python -c "import pip, certifi; from pip._vendor import certifi as bundled; assert tuple(map(int, pip.__version__.split('.'))) >= (26, 2, 2); assert tuple(map(int, certifi.__version__.split('.'))) >= (2026, 10, 19); assert tuple(map(int, bundled.__version__.split('.'))) >= (2026, 10, 19)"
        python -m pip download --no-deps --dest "$RUNNER_TEMP/python-bootstrap" "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
        echo "VIRTUALENV_EXTRA_SEARCH_DIR=$RUNNER_TEMP/python-bootstrap" >> "$GITHUB_ENV"
        echo "VIRTUALENV_PIP=26.2.2" >> "$GITHUB_ENV"
        echo "VIRTUALENV_DOWNLOAD=false" >> "$GITHUB_ENV"
    - name: Install Hatch
      run: pip install hatch

    - name: Verify tag matches project version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PROJECT_VERSION="$(hatch version)"

        echo "Tag version: ${TAG_VERSION}"
        echo "Project version: ${PROJECT_VERSION}"

        if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match project version ${PROJECT_VERSION}"
          exit 1
        fi

    - name: Build package
      run: |
        rm -rf dist
        hatch build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
